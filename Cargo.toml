[package]
name = "any-gpu"
version = "0.1.0"
edition = "2024"
description = "Tensor engine for every GPU. AMD, NVIDIA, Intel, Apple. One codebase, zero vendor lock-in. wgpu under the hood."
license = "Unlicense"
repository = "https://github.com/cochranblock/any-gpu"
keywords = ["gpu", "wgpu", "tensor", "ml", "compute"]
categories = ["science", "graphics"]

[dependencies]
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
blake3 = "1"
futures-channel = "0.3"
half = { version = "2", features = ["bytemuck"] }
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
clap = { version = "4", features = ["derive"] }
exopack = { version = "0.2", optional = true, features = ["triple_sims"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Gpu", "GpuAdapter", "GpuDevice", "Window", "Navigator"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[dependencies.candle-core]
version = "0.10"
optional = true

[dev-dependencies]
rand = "0.8"
tempfile = "3"

[features]
default = []
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]
candle-bench = ["candle-core"]
tests = ["dep:exopack"]

[[bin]]
name = "any-gpu-test"
path = "src/bin/any-gpu-test.rs"
required-features = ["tests"]

[[bin]]
name = "any-gpu-serve"
path = "src/bin/serve.rs"

[[example]]
name = "candle_bench"
required-features = ["candle-core"]

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
